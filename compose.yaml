name: orbe

services:
  db:
    image: pgvector/pgvector:0.8.7-pg16
    environment:
      POSTGRES_USER: orbe
      POSTGRES_PASSWORD: orbe
      POSTGRES_DB: orbe
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - orbe-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbe -d orbe"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
    environment:
      APP_ENV: local
      APP_HOST: 0.0.0.0
      APP_PORT: "8000"
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+psycopg://orbe:orbe@db:5432/orbe
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_CHAT_MODEL: gpt-4o-mini
      OPENAI_EMBEDDING_MODEL: text-embedding-3-small
      EMBEDDING_DIMENSIONS: "1536"
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-orbe}
      COLLECTION_NAME: orbe_dossiers
      QUERY_MAX_DISTANCE: "0.5"
      QUERY_MATCH_LIMIT: "5"
      QUERY_MAX_CHARS: "2000"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    restart: unless-stopped

volumes:
  orbe-postgres:
