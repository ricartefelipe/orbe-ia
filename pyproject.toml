[project]
name = "orbe-ia"
version = "0.1.0"
description = "Mesa de leitura de dossiês com RAG, LangChain e citações verificáveis."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.143,<0.144",
    "langchain>=1.4.4,<2",
    "langchain-community>=0.4.2,<0.5",
    "langchain-openai>=1.7,<2",
    "langchain-postgres>=0.0.19,<0.1",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.10,<3",
    "pypdf>=6,<7",
    "python-multipart>=0.0.20,<1",
    "sqlalchemy>=2.1.4,<2.2",
    "uvicorn[standard]>=0.32,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "mypy>=1.15,<2",
    "pip-audit>=2.9,<3",
    "pytest>=9.0.3,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.11,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orbe"]

[tool.hatch.build.targets.wheel.force-include]
"src/orbe/interface/assets/index.html" = "orbe/interface/assets/index.html"
"src/orbe/interface/assets/app.css" = "orbe/interface/assets/app.css"
"src/orbe/interface/assets/app.js" = "orbe/interface/assets/app.js"

[tool.hatch.build.targets.sdist.force-include]
"src/orbe/interface/assets/index.html" = "src/orbe/interface/assets/index.html"
"src/orbe/interface/assets/app.css" = "src/orbe/interface/assets/app.css"
"src/orbe/interface/assets/app.js" = "src/orbe/interface/assets/app.js"

[tool.uv]
package = true
required-version = ">=0.13.0"

[tool.pytest.ini_options]
addopts = [
    "--strict-markers",
    "--cov=orbe",
    "--cov-report=term-missing",
]
markers = [
    "integration: tests that require a local PostgreSQL database with pgvector",
]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    "ignore:.*langchain-community.*:DeprecationWarning",
]

[tool.coverage.run]
source = ["orbe"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S104", "S105", "S106"]

[tool.ruff.lint.isort]
known-first-party = ["orbe", "tests"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_redundant_casts = true
mypy_path = ["src"]
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_decorators = false
